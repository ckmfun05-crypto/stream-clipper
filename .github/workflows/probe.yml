name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv and yt-dlp
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install --python "$HOME/.venv/bin/python" yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test Twitch endpoints
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "=== GraphQL ==="
          timeout 30s curl -sS -o /dev/null -w '%{http_code}\n' -X POST https://gql.twitch.tv/gql \
            -H 'Client-ID: kimne78kx3ncx6brgo4mv6wki5h1ko' -H 'Content-Type: application/json' \
            --data '[{"operationName":null,"variables":{},"query":"query { __typename }"}]' || echo "graphql failed"
          echo "=== yt-dlp simulate ==="
          timeout 60s "$HOME/.venv/bin/yt-dlp" --simulate --no-warnings --dump-json \
            https://www.twitch.tv/videos/2933192897 2>&1 | head -c 3000 || echo "simulate failed"
          echo "=== yt-dlp section ==="
          timeout 90s "$HOME/.venv/bin/yt-dlp" --no-playlist --no-warnings \
            -f 'bestvideo[height<=720]+bestaudio/best' --merge-output-format mp4 \
            --download-sections '*60-90' --force-keyframes-at-cuts \
            -o /tmp/probe.mp4 https://www.twitch.tv/videos/2933192897 2>&1 | head -c 3000 || echo "section failed"
          ls -la /tmp/probe.mp4 2>/dev/null || true
