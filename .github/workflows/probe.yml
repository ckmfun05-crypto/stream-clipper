name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv, yt-dlp, ffmpeg
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          uv pip install --python "$PWD/.venv/bin/python" yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          ffmpeg -version | head -1
      - name: Test deep HLS seeks
        run: |
          VOD=https://www.twitch.tv/videos/2933192897
          YDL="$PWD/.venv/bin/yt-dlp"
          URL=$(timeout 30s "$YDL" -g -f 'best[height<=720]/best' "$VOD" 2>/dev/null | head -1)
          echo "url=${URL:0:120}"
          for START in 1800 3600; do
            echo "=== ffmpeg -ss $START duration 30 ==="
            S=$SECONDS
            timeout 90s ffmpeg -y -loglevel error -ss "$START" -i "$URL" -t 30 \
              -map 0:v:0 -map 0:a:0? -c copy -bsf:a aac_adtstoasc -movflags +faststart \
              "/tmp/deep${START}.mp4" 2>&1 | tail -c 1000
            echo "ss=$START elapsed=$((SECONDS-S))s size=$(stat -c%s /tmp/deep${START}.mp4 2>/dev/null || echo 0) duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/deep${START}.mp4 2>/dev/null || echo 0)"
          done
