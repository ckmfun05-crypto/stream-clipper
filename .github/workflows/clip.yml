# EXPERIMENTAL: scheduled runs may be blocked by Twitch/YouTube datacenter IP
# checks, and the YouTube login session expires periodically. Running on your
# own PC is the reliable path. See README.md.
name: clip

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Cut a clip but skip uploading (safe test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stream-clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CHANNEL_NAME: GT6xCLIPS
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv --version

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install stream-clipper dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          uv venv
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" -e .

      - name: Install social-auto-upload
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git clone https://github.com/dreammis/social-auto-upload.git "$HOME/social-auto-upload"
          cd "$HOME/social-auto-upload"
          cp conf.example.py conf.py
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" -e "."
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" patchright
          "$GITHUB_WORKSPACE/.venv/bin/patchright" install chromium
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/patch_sau_youtube_auth.py" "$HOME/social-auto-upload"

      - name: Restore YouTube login state
        env:
          YOUTUBE_COOKIE_B64: ${{ secrets.YOUTUBE_COOKIE_B64 }}
        run: |
          mkdir -p "$HOME/social-auto-upload/cookies"
          TMP_COOKIE="$(mktemp)"
          printf '%s' "$YOUTUBE_COOKIE_B64" | base64 -d > "$TMP_COOKIE"
          if gzip -t "$TMP_COOKIE" 2>/dev/null; then
            gunzip -c "$TMP_COOKIE" > "$HOME/social-auto-upload/cookies/youtube_creator.json"
          else
            cp "$TMP_COOKIE" "$HOME/social-auto-upload/cookies/youtube_creator.json"
          fi
          rm -f "$TMP_COOKIE"
          "$GITHUB_WORKSPACE/.venv/bin/sau" youtube check --account creator

      - name: Run clipper
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          if [ "$DRY_RUN" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update processed state [skip ci]"
            git push
          fi
