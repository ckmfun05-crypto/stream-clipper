[project]
name = "stream-clipper"
version = "0.1.0"
description = "Free, automatic Twitch highlight clipper and YouTube Shorts uploader"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "yt-dlp>=2024.1.1",
    "streamlink>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stream-clipper = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run"]
packages = ["clipper"]
